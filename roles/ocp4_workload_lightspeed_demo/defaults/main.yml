---
# --------------------------------
# OpenShift Lightspeed Demo Content
# --------------------------------

# OLS namespace (must match the namespace where OLS is installed)
ocp4_workload_lightspeed_demo_ols_namespace: openshift-lightspeed

# --------------------------------
# RHEL9 VM Configuration
# --------------------------------

# Namespace for the demo VM
ocp4_workload_lightspeed_demo_vm_namespace: lightspeed-demo

# VM Configuration
ocp4_workload_lightspeed_demo_vm_name: rhel9-demo
ocp4_workload_lightspeed_demo_vm_running: true

# Resources
ocp4_workload_lightspeed_demo_vm_cpu_cores: 1
ocp4_workload_lightspeed_demo_vm_memory: 2Gi
ocp4_workload_lightspeed_demo_vm_disk_size: 30Gi

# Image source
ocp4_workload_lightspeed_demo_vm_image: quay.io/containerdisks/rhel:9-latest

# Cloud-init user
ocp4_workload_lightspeed_demo_vm_user: cloud-user
ocp4_workload_lightspeed_demo_vm_password: redhat

# --------------------------------
# RAG Deployment Configuration
# --------------------------------

# Enable RAG integration for OLS
ocp4_workload_lightspeed_demo_enable_rag: true

# RAG container image (ACME BYOK demo content)
ocp4_workload_lightspeed_demo_rag_image: 'quay.io/dialvare/acme-byok:latest'

# --------------------------------
# Broken Pod Configuration
# --------------------------------

# Create a broken pod for demo/troubleshooting scenarios
ocp4_workload_lightspeed_demo_create_broken_pod: true

# Namespace for the broken pod
ocp4_workload_lightspeed_demo_broken_pod_namespace: broken

# Broken pod name
ocp4_workload_lightspeed_demo_broken_pod_name: broken-pod

# --------------------------------
# Agentic OLS Configuration
# --------------------------------

# Master flag — disabled by default (pre-release feature, not yet on OperatorHub)
ocp4_workload_lightspeed_demo_enable_agentic: false

# Source repo for the quickstart scripts (shallow-cloned at deploy time)
ocp4_workload_lightspeed_demo_agentic_repo_url: https://github.com/openshift/lightspeed-agentic-operator
ocp4_workload_lightspeed_demo_agentic_repo_version: main

# Sub-component flags (only apply when enable_agentic is true)
ocp4_workload_lightspeed_demo_agentic_enable_postgres: false
ocp4_workload_lightspeed_demo_enable_agentic_alerts_adapter: true
ocp4_workload_lightspeed_demo_agentic_enable_console: true

ocp4_workload_lightspeed_demo_agentic_model: gpt-5
ocp4_workload_lightspeed_demo_agentic_azure_endpoint: https://llm-gpt4-lightspeed.cognitiveservices.azure.com

# Optional image overrides — empty string means the deploy scripts use their Konflux :main defaults
ocp4_workload_lightspeed_demo_agentic_operator_image: ""
ocp4_workload_lightspeed_demo_agentic_sandbox_image: ""
ocp4_workload_lightspeed_demo_agentic_console_image: ""
ocp4_workload_lightspeed_demo_agentic_alerts_adapter_image: ""
ocp4_workload_lightspeed_demo_agentic_otel_image: ""
